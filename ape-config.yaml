name: test-hardhat

ethereum:
  default_network: sepolia-fork
  sepolia_fork:
    default_provider: hardhat

hardhat:
  hardhat_config_file: ./hardhat.config.js

dependencies:
  - name: OpenZeppelin
    npm: "@openzeppelin/contracts"
    version: 5.0.0
  - name: UMA
    npm: "@uma/core"
    version: 3.1.0

solidity:
  version: 0.8.28
  import_remapping:
    - "@openzeppelin/contracts=OpenZeppelin"
    - "@uma/core=UMA"

compile:
  exclude:
    - "**/build/**"
    - "**/artifacts/**"
    - "**/*.json"
